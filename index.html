<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b30"><meta name="description" content="BLOCK RUSH 8 STUDIO。標準16種類とチャレンジ28種類、軽快なドラッグ、爽快なコンボと効果音。"><title>BLOCK RUSH 8 STUDIO</title><link rel="stylesheet" href="style.css?v=studioflow1"><link rel="stylesheet" href="quality.css?v=studioflow1"><link rel="stylesheet" href="studio.css?v=studioflow1"><link rel="stylesheet" href="clarity.css?v=studioflow1"><link rel="stylesheet" href="mobile-quality.css?v=quality1"></head>
<body data-quality="1" data-game="block"><section id="startup" role="status"><h2>BLOCK RUSH 8</h2><p id="startupMessage">ゲームを読み込んでいます…</p><button id="retryLoad" hidden>もう一度読み込む</button></section><main id="game" inert>
<header><div class="brand"><span class="mark" aria-hidden="true">▦</span><div><h1>BLOCK RUSH <em>8</em></h1><p>STUDIO <span>• PRECISION & FLOW</span></p></div></div><button id="sound" class="icon" aria-label="サウンドを切り替え" aria-pressed="true">♪</button></header>
<nav aria-label="ゲームモード"><button id="classic" aria-pressed="true">クラシック</button><button id="daily" aria-pressed="false">◈ デイリー</button></nav>
<section class="stats" aria-label="スコア"><div class="score-card"><span>SCORE</span><strong id="score">0</strong><small id="gain"></small></div><div><span>BEST <small id="bestLabel">CLASSIC</small></span><strong id="best">0</strong></div><div><span>COMBO</span><strong id="combo">—</strong></div></section>
<section class="rank-panel" aria-label="ランク進行"><div><span id="rankName"></span><b id="rankGoal"></b></div><div class="rank-track"><i id="rankFill"></i></div></section><div class="board-caption"><span id="modeLabel">自由に、あなたのペースで。</span><span>8 × 8</span></div>
<div id="stage"><div id="board" role="grid" aria-label="8×8のゲーム盤面"></div><div id="clearNotice" class="flow-cheer" aria-hidden="true" hidden></div><div id="effects" aria-hidden="true"></div><div id="paused" hidden><button id="resume">▶ 再開する</button></div></div>
<div id="prediction" role="status"></div><p id="message" role="status" aria-live="polite">ブロックを選んで、盤面に置こう。</p>
<div id="pieces" class="pieces" aria-label="手持ちのブロック"></div>
<section class="missions"><div class="section-title"><span id="missionTitle">SESSION MISSIONS</span><span id="missionCount">0 / 3</span></div><div id="missions"></div></section>
<div class="studio-tools"><button id="musicToggle" aria-pressed="true">♫ BGM</button><div class="difficulty-switch" role="group" aria-label="難易度 / Difficulty"><button id="standardDifficulty" aria-pressed="false">標準 16種類</button><button id="challengeDifficulty" aria-pressed="true">チャレンジ 28種類</button></div><button id="difficulty" hidden aria-label="難易度 / Difficulty">▦ 28</button><button id="records">◇ RECORDS</button></div><div class="language-row"><button id="language" aria-label="日本語 / English">日本語 / English</button></div><footer><button id="restart">↻ 最初から</button><button id="pause">Ⅱ 一時停止</button><button id="soundTest">♪ 効果音を試す</button><button id="help">? 遊び方</button></footer>
<p class="hint">選んでタップ ／ ドラッグで配置<br>時間制限なし。ラインをつないで、自分のベストへ。</p>
</main><dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-content"><span class="eyebrow">BLOCK RUSH 8</span><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions"><button id="dialogCancel" type="button" value="cancel">戻る</button><button id="dialogOK" type="button" value="ok">OK</button></div></div></dialog>
